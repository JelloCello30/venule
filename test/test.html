<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>venule — pipeline test</title>
<style>
  body { font-family: ui-monospace, Menlo, monospace; background: #0c0e10; color: #e9ebe7; padding: 24px; }
  h1 { font-size: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  figure { margin: 0; }
  figcaption { font-size: 11px; color: #97a19c; margin-top: 4px; }
  canvas { border: 1px solid rgba(255,255,255,.15); width: 340px; }
  #summary { font-size: 13px; white-space: pre; background: #15181b; padding: 14px; border-radius: 8px; margin-top: 8px; }
  .pass { color: #46e0b4; } .fail { color: #ff7a5c; }
</style>
</head>
<body>
<h1>venule pipeline test — synthetic arm, known veins, known false positives</h1>
<div id="summary">running…</div>
<div class="row">
  <figure><canvas id="c-in"></canvas><figcaption>input (veins + hair + shading)</figcaption></figure>
  <figure><canvas id="c-hemo"></canvas><figcaption>hemoglobin map</figcaption></figure>
  <figure><canvas id="c-out"></canvas><figcaption>Veins view (as shipped)</figcaption></figure>
</div>

<script src="../js/vision.js"></script>
<script>
(function () {
  'use strict';
  var W = 480, H = 360, N = W * H;
  var V = window.VenuleVision;

  var seed = 12345;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

  // ---- scene definition -------------------------------------------------
  var VEINS = [
    { w: 8, a: 0.30, p: [[40, 300], [140, 220], [260, 200], [430, 120]] },
    { w: 5, a: 0.24, p: [[80, 340], [180, 300], [300, 290], [440, 230]] },
    { w: 4, a: 0.16, p: [[30, 180], [140, 150], [240, 170], [400, 60]] }
  ];
  // Neutral absorbers that must NOT be amplified: hairs and a shadow band.
  // Neutral = same multiplicative factor on R, G and B.
  var HAIRS = [
    { w: 3, k: 0.55, p: [[70, 60], [180, 130], [300, 120], [430, 190]] },
    { w: 2, k: 0.60, p: [[100, 250], [230, 300], [360, 250]] },
    { w: 4, k: 0.62, p: [[380, 330], [430, 250], [460, 140]] }
  ];

  function strokePath(ctx, p) {
    ctx.beginPath();
    ctx.moveTo(p[0][0], p[0][1]);
    for (var i = 1; i < p.length - 1; i++) {
      var xc = (p[i][0] + p[i + 1][0]) / 2, yc = (p[i][1] + p[i + 1][1]) / 2;
      ctx.quadraticCurveTo(p[i][0], p[i][1], xc, yc);
    }
    ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
    ctx.stroke();
  }

  function maskOf(list, pad) {
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#fff'; ctx.lineCap = 'round';
    list.forEach(function (v) { ctx.lineWidth = v.w + pad; strokePath(ctx, v.p); });
    var d = ctx.getImageData(0, 0, W, H).data;
    var m = new Uint8Array(N);
    for (var i = 0; i < N; i++) m[i] = d[i * 4] > 128 ? 1 : 0;
    return m;
  }

  var veinMask = maskOf(VEINS, 0);
  var veinPad = maskOf(VEINS, 14);
  var hairMask = maskOf(HAIRS, 8);
  var hairPad = maskOf(HAIRS, 16);

  // Build the scene physically: start from a skin base, apply a smooth
  // illumination gradient (neutral), multiply hairs in (neutral), and add
  // hemoglobin to veins (NOT neutral — absorbs green/red, spares blue).
  // skinTone scales melanin, letting us prove tone-invariance.
  function buildScene(skinTone) {
    var base = [214 * skinTone, 176 * skinTone * 0.92, 150 * skinTone * 0.86];
    var px = new Uint8ClampedArray(N * 4);
    var vm = maskOf(VEINS, 0), hm = maskOf(HAIRS, 0);
    // soft-edged versions for realism
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        var i = y * W + x, j = i * 4;
        // neutral illumination gradient + gentle mottling
        var shade = 0.72 + 0.38 * (x / W) + 0.10 * Math.sin(y * 0.017) + 0.05 * Math.sin(x * 0.021);
        var r = base[0] * shade, g = base[1] * shade, b = base[2] * shade;
        if (hm[i]) { var k = 0.58; r *= k; g *= k; b *= k; }   // hair: neutral
        if (vm[i]) {                                            // vein: spectral
          r *= 0.90; g *= 0.82; b *= 0.985;
        }
        var nz = (rnd() - 0.5) * 9;
        px[j] = r + nz; px[j + 1] = g + nz; px[j + 2] = b + nz; px[j + 3] = 255;
      }
    }
    return px;
  }

  var input = buildScene(1.0);
  var cIn = document.getElementById('c-in');
  cIn.width = W; cIn.height = H;
  cIn.getContext('2d').putImageData(new ImageData(input, W, H), 0, 0);

  function stats(arr, mask, exclude) {
    var s = 0, n = 0;
    for (var i = 0; i < N; i++) {
      var x = i % W, y = (i / W) | 0;
      if (x < 10 || y < 10 || x >= W - 10 || y >= H - 10) continue;
      if (mask ? !mask[i] : (exclude && exclude[i])) continue;
      s += arr[i]; n++;
    }
    return { mean: s / Math.max(n, 1), n: n };
  }

  // ---- 1. hemoglobin separation ----------------------------------------
  var hemo = new Float32Array(N);
  V.hemoglobinMap(input, null, null, null, hemo, N);

  var hOnVein = stats(hemo, veinMask).mean;
  var hOnHair = stats(hemo, hairMask).mean;
  var hOnSkin = stats(hemo, null, function (i) { return veinPad[i] || hairPad[i]; }).mean;
  // recompute plain-skin baseline properly (exclude both structures)
  var skinSum = 0, skinN = 0;
  for (var q = 0; q < N; q++) {
    var qx = q % W, qy = (q / W) | 0;
    if (qx < 10 || qy < 10 || qx >= W - 10 || qy >= H - 10) continue;
    if (veinPad[q] || hairPad[q]) continue;
    skinSum += hemo[q]; skinN++;
  }
  hOnSkin = skinSum / skinN;

  var veinLift = hOnVein - hOnSkin;   // must be clearly positive
  var hairLift = hOnHair - hOnSkin;   // must be ~0 (neutral absorber)
  var separation = veinLift / Math.max(Math.abs(hairLift), 1e-6);

  // ---- 2. shading invariance -------------------------------------------
  // The illumination gradient spans 0.72..1.10 across the frame. A method
  // that keys on brightness would show a big left-right drift in "skin".
  var leftSum = 0, leftN = 0, rightSum = 0, rightN = 0;
  for (var s2 = 0; s2 < N; s2++) {
    var sx = s2 % W, sy = (s2 / W) | 0;
    if (sy < 10 || sy >= H - 10) continue;
    if (veinPad[s2] || hairPad[s2]) continue;
    if (sx > 20 && sx < W * 0.25) { leftSum += hemo[s2]; leftN++; }
    if (sx > W * 0.75 && sx < W - 20) { rightSum += hemo[s2]; rightN++; }
  }
  var shadingDrift = Math.abs(leftSum / leftN - rightSum / rightN);
  var shadingVsVein = veinLift / Math.max(shadingDrift, 1e-6);

  // ---- 3. skin-tone invariance -----------------------------------------
  // Same veins, much darker skin. The vein lift should survive, because
  // melanin lands in its own term.
  var darkInput = buildScene(0.55);
  var hemoDark = new Float32Array(N);
  V.hemoglobinMap(darkInput, null, null, null, hemoDark, N);
  var dOnVein = stats(hemoDark, veinMask).mean;
  var dSum = 0, dN = 0;
  for (var r2 = 0; r2 < N; r2++) {
    var rx = r2 % W, ry = (r2 / W) | 0;
    if (rx < 10 || ry < 10 || rx >= W - 10 || ry >= H - 10) continue;
    if (veinPad[r2] || hairPad[r2]) continue;
    dSum += hemoDark[r2]; dN++;
  }
  var darkVeinLift = dOnVein - dSum / dN;
  var toneRetention = darkVeinLift / Math.max(veinLift, 1e-9);

  // ---- 4. end-to-end Veins view ----------------------------------------
  var bufs = V.makeBuffers(W, H);
  var state = V.makeState();
  var out = new ImageData(W, H);
  var t0 = performance.now();
  var res = V.analyzeReveal(input, out.data, bufs, state, { strength: 0.6, still: true });
  var ms = performance.now() - t0;

  // deviation from the 128 neutral in the shipped layer
  var dev = new Float32Array(N);
  for (var d2 = 0; d2 < N; d2++) dev[d2] = Math.abs(out.data[d2 * 4] - 128);
  var devVein = stats(dev, veinMask).mean;
  var devHair = stats(dev, hairMask).mean;
  var devSkin = (function () {
    var s3 = 0, n3 = 0;
    for (var i = 0; i < N; i++) {
      var x = i % W, y = (i / W) | 0;
      if (x < 10 || y < 10 || x >= W - 10 || y >= H - 10) continue;
      if (veinPad[i] || hairPad[i]) continue;
      s3 += dev[i]; n3++;
    }
    return s3 / n3;
  })();
  var renderVeinVsHair = devVein / Math.max(devHair, 1e-6);

  // ---- 5. temporal stacking --------------------------------------------
  function noisy(px) {
    var f = new Uint8ClampedArray(px);
    for (var q2 = 0; q2 < f.length; q2 += 4) {
      var nz = (rnd() - 0.5) * 14;
      f[q2] += nz; f[q2 + 1] += nz; f[q2 + 2] += nz;
    }
    return f;
  }
  function shifted(px, dx, dy) {
    var f = new Uint8ClampedArray(N * 4);
    for (var y = 0; y < H; y++) {
      var sy = Math.min(H - 1, Math.max(0, y + dy));
      for (var x = 0; x < W; x++) {
        var sx = Math.min(W - 1, Math.max(0, x + dx));
        var si = (sy * W + sx) * 4, di = (y * W + x) * 4;
        var nz = (rnd() - 0.5) * 14;
        f[di] = px[si] + nz; f[di + 1] = px[si + 1] + nz;
        f[di + 2] = px[si + 2] + nz; f[di + 3] = 255;
      }
    }
    return f;
  }
  function skinNoiseOf(o) {
    var s4 = 0, n4 = 0;
    for (var i = 0; i < N; i++) {
      var x = i % W, y = (i / W) | 0;
      if (x < 14 || y < 14 || x >= W - 14 || y >= H - 14) continue;
      if (veinPad[i] || hairPad[i]) continue;
      s4 += Math.abs(o.data[i * 4] - 128); n4++;
    }
    return s4 / n4;
  }
  var stS = V.makeState();
  V.analyzeReveal(noisy(input), out.data, bufs, stS, { strength: 0.6, still: false });
  var noise1 = skinNoiseOf(out);
  for (var f2 = 0; f2 < 25; f2++) {
    V.analyzeReveal(noisy(input), out.data, bufs, stS, { strength: 0.6, still: false });
  }
  var noiseStacked = skinNoiseOf(out);
  var stackDrop = noiseStacked / Math.max(noise1, 1e-9);

  // shaken stack: ±5 px per frame
  var stA = V.makeState();
  V.analyzeReveal(shifted(input, 0, 0), out.data, bufs, stA, { strength: 0.6, still: false });
  for (var f3 = 0; f3 < 25; f3++) {
    V.analyzeReveal(shifted(input, ((rnd() * 11) | 0) - 5, ((rnd() * 11) | 0) - 5),
      out.data, bufs, stA, { strength: 0.6, still: false });
  }
  V.analyzeReveal(shifted(input, 0, 0), out.data, bufs, stA, { strength: 0.6, still: false });
  var shakenVein = (function () {
    var s5 = 0, n5 = 0;
    for (var i = 0; i < N; i++) {
      var x = i % W, y = (i / W) | 0;
      if (x < 16 || y < 16 || x >= W - 16 || y >= H - 16) continue;
      if (!veinMask[i]) continue;
      s5 += Math.abs(out.data[i * 4] - 128); n5++;
    }
    return s5 / n5;
  })();

  // ---- 6. contact PPG ---------------------------------------------------
  // Simulate a covered lens: dark red field modulated at 1.15 Hz (69 bpm).
  var ps = V.makePulseState();
  var PW = 64, PH = 48, PN = PW * PH;
  var pf = new Uint8ClampedArray(PN * 4);
  for (var fr = 0; fr < 300; fr++) {
    var tMs = fr * (1000 / 30);
    var beat = Math.sin(2 * Math.PI * 1.15 * (tMs / 1000));
    for (var p2 = 0, pj = 0; p2 < PN; p2++, pj += 4) {
      pf[pj] = 150 + (rnd() - 0.5) * 3;                  // red: high (torch through finger)
      pf[pj + 1] = 42 + beat * 2.2 + (rnd() - 0.5) * 2;  // green: the PPG signal
      pf[pj + 2] = 30 + (rnd() - 0.5) * 2;
      pf[pj + 3] = 255;
    }
    V.pulseSample(ps, pf, PN, tMs);
  }
  var ppg = V.pulseBpm(ps);
  var ppgOk = ps.covered && ppg.conf >= 0.45 && ppg.bpm >= 62 && ppg.bpm <= 76;

  // uncovered lens must be rejected, not guessed at
  var ps2 = V.makePulseState();
  var bright = new Uint8ClampedArray(PN * 4);
  for (var b2 = 0; b2 < PN * 4; b2 += 4) {
    bright[b2] = 200; bright[b2 + 1] = 190; bright[b2 + 2] = 180; bright[b2 + 3] = 255;
  }
  var cov2 = V.pulseSample(ps2, bright, PN, 0).covered;

  // ---- panels -----------------------------------------------------------
  (function () {
    var c = document.getElementById('c-hemo');
    c.width = W; c.height = H;
    var im = c.getContext('2d').createImageData(W, H);
    var lo = 1e9, hi = -1e9;
    for (var i = 0; i < N; i++) { if (hemo[i] < lo) lo = hemo[i]; if (hemo[i] > hi) hi = hemo[i]; }
    for (var i2 = 0, j2 = 0; i2 < N; i2++, j2 += 4) {
      var v = (hemo[i2] - lo) / (hi - lo) * 255;
      im.data[j2] = v; im.data[j2 + 1] = v; im.data[j2 + 2] = v; im.data[j2 + 3] = 255;
    }
    c.getContext('2d').putImageData(im, 0, 0);
  })();
  (function () {
    var st = V.makeState();
    var o = new ImageData(W, H);
    V.analyzeReveal(input, o.data, bufs, st, { strength: 0.6, still: true });
    var c = document.getElementById('c-out');
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    g.putImageData(new ImageData(new Uint8ClampedArray(input), W, H), 0, 0);
    var lay = document.createElement('canvas');
    lay.width = W; lay.height = H;
    lay.getContext('2d').putImageData(o, 0, 0);
    g.globalCompositeOperation = 'hard-light';
    g.drawImage(lay, 0, 0);
    g.globalCompositeOperation = 'source-over';
  })();

  // ---- verdict ----------------------------------------------------------
  var pass =
    veinLift > 0.004 && separation >= 8 && shadingVsVein >= 4 &&
    toneRetention >= 0.6 &&
    renderVeinVsHair >= 5 && devVein >= 8 &&
    stackDrop <= 0.88 && shakenVein >= 6 &&
    ppgOk && cov2 === false;

  var lines = [
    'HEMOGLOBIN SEPARATION (Tsumura)',
    '  vein lift over skin     : ' + veinLift.toFixed(5) + '   (need > 0.004)',
    '  hair lift over skin     : ' + hairLift.toFixed(5) + '   (neutral → ~0)',
    '  vein/hair separation    : ' + separation.toFixed(1) + 'x     (need ≥ 8x)',
    '  vein lift / shading drift: ' + shadingVsVein.toFixed(1) + 'x     (need ≥ 4x)',
    '  dark-skin lift retained : ' + (toneRetention * 100).toFixed(0) + '%      (need ≥ 60%)',
    '',
    'VEINS VIEW (end to end)',
    '  amplitude on vein       : ' + devVein.toFixed(1) + '      (need ≥ 8)',
    '  amplitude on hair       : ' + devHair.toFixed(1),
    '  amplitude on plain skin : ' + devSkin.toFixed(1),
    '  vein/hair in output     : ' + renderVeinVsHair.toFixed(1) + 'x     (need ≥ 5x)',
    '',
    'TEMPORAL STACKING',
    // floor is not 0: plain "skin" carries real mottling and an
    // illumination gradient, which stacking correctly preserves
    '  noise after 25 frames   : ' + (stackDrop * 100).toFixed(0) + '% of single frame (need ≤ 88%)',
    '  vein amp, ±5px shake    : ' + shakenVein.toFixed(1) + '      (need ≥ 6)',
    '',
    'CONTACT PPG',
    '  rate (true 69)          : ' + ppg.bpm.toFixed(1) + ' bpm, conf ' + ppg.conf.toFixed(2) + '  (need 62-76 @ ≥0.45)',
    '  uncovered lens rejected : ' + (cov2 === false ? 'yes' : 'NO'),
    '',
    '  frame time              : ' + ms.toFixed(1) + ' ms @ ' + W + 'x' + H,
    '',
    pass ? 'RESULT: PASS' : 'RESULT: FAIL'
  ];
  var el = document.getElementById('summary');
  el.textContent = lines.join('\n');
  el.className = pass ? 'pass' : 'fail';
  window.__venuleTest = {
    veinLift: veinLift, hairLift: hairLift, separation: separation,
    shadingVsVein: shadingVsVein, toneRetention: toneRetention,
    devVein: devVein, devHair: devHair, renderVeinVsHair: renderVeinVsHair,
    stackDrop: stackDrop, shakenVein: shakenVein,
    bpm: ppg.bpm, bpmConf: ppg.conf, ppgOk: ppgOk, uncoveredRejected: cov2 === false,
    ms: ms, pass: pass
  };
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>venule — real-photo check</title>
<style>
  body { font-family: ui-monospace, Menlo, monospace; background: #0c0e10; color: #e9ebe7; padding: 20px; }
  h1 { font-size: 15px; margin-bottom: 10px; }
  #report { font-size: 12px; white-space: pre; background: #15181b; padding: 12px; border-radius: 8px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; margin-bottom: 14px; align-items: flex-start; }
  .row figure { margin: 0; }
  .row figcaption { font-size: 10px; color: #97a19c; margin-top: 3px; }
  canvas { border: 1px solid rgba(255,255,255,.12); width: 300px; }
</style>
</head>
<body>
<h1>venule real-photo check — fixtures are local only (gitignored)</h1>
<div id="report">running…</div>
<div id="grid"></div>

<script type="module">
try {
  const m = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  window.__venuleSeg = { FilesetResolver: m.FilesetResolver, ImageSegmenter: m.ImageSegmenter };
} catch (e) { window.__venuleSeg = null; }
</script>
<script src="../js/vision.js"></script>
<script>
(async function () {
  'use strict';
  var V = window.VenuleVision;
  var FILES = ['handvein.jpg', 'armveins.jpg', 'hands.jpg', 'forearm.jpg', 'skin.jpg', 'clutter.jpg'];
  var report = {};

  // try to bring up the neural segmenter (IMAGE mode); fall back silently
  var segmenter = null;
  for (var t = 0; t < 80 && window.__venuleSeg === undefined; t++) {
    await new Promise(function (r) { setTimeout(r, 100); });
  }
  if (window.__venuleSeg) {
    try {
      var fileset = await window.__venuleSeg.FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      segmenter = await window.__venuleSeg.ImageSegmenter.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite' },
        runningMode: 'IMAGE',
        outputCategoryMask: true,
        outputConfidenceMasks: false
      });
    } catch (e) { segmenter = null; }
  }

  function segmentCanvas(canvas) {
    return new Promise(function (resolve) {
      if (!segmenter) { resolve(null); return; }
      try {
        segmenter.segment(canvas, function (result) {
          var cm = result.categoryMask;
          var out = cm ? { data: new Uint8Array(cm.getAsUint8Array()), w: cm.width, h: cm.height } : null;
          result.close();
          resolve(out);
        });
      } catch (e) { resolve(null); }
    });
  }

  function loadImg(src) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () { res(im); };
      im.onerror = rej;
      im.src = src;
    });
  }

  function panel(row, caption, w, h) {
    var fig = document.createElement('figure');
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var cap = document.createElement('figcaption');
    cap.textContent = caption;
    fig.appendChild(c); fig.appendChild(cap);
    row.appendChild(fig);
    return c;
  }

  for (var fi = 0; fi < FILES.length; fi++) {
    var f = FILES[fi];
    var img;
    try { img = await loadImg('fixtures/' + f); } catch (e) { continue; }
    var W = Math.min(512, img.naturalWidth);
    var H = Math.round(img.naturalHeight * W / img.naturalWidth / 2) * 2;

    var row = document.createElement('div');
    row.className = 'row';
    document.getElementById('grid').appendChild(row);

    var cIn = panel(row, f + ' — original', W, H);
    var xin = cIn.getContext('2d');
    xin.drawImage(img, 0, 0, W, H);
    var data = xin.getImageData(0, 0, W, H);

    var bufs = V.makeBuffers(W, H);
    var cat = await segmentCanvas(cIn);
    var segArgs = { catMask: cat && cat.data, catW: cat ? cat.w : 0, catH: cat ? cat.h : 0 };

    // hemoglobin map panel (the physical quantity the view is built on)
    var hemo = new Float32Array(W * H);
    var shade = new Float32Array(W * H);
    V.hemoglobinMap(data.data, null, null, null, hemo, W * H, shade);
    var cH = panel(row, 'hemoglobin (blood)', W, H);
    var imH = cH.getContext('2d').createImageData(W, H);
    var lo = 1e9, hi = -1e9, k;
    for (k = 0; k < W * H; k++) { if (hemo[k] < lo) lo = hemo[k]; if (hemo[k] > hi) hi = hemo[k]; }
    for (k = 0; k < W * H; k++) {
      var vv = (hemo[k] - lo) / (hi - lo + 1e-9) * 255, kj = k * 4;
      imH.data[kj] = vv; imH.data[kj + 1] = vv; imH.data[kj + 2] = vv; imH.data[kj + 3] = 255;
    }
    cH.getContext('2d').putImageData(imH, 0, 0);

    // the shipped Veins view
    var state = V.makeState();
    var revImg = new ImageData(W, H);
    var res = V.analyzeReveal(data.data, revImg.data, bufs, state,
      { strength: 0.6, still: true, catMask: segArgs.catMask, catW: segArgs.catW, catH: segArgs.catH });
    var cR = panel(row, 'Veins view (shipped)', W, H);
    var xr = cR.getContext('2d');
    xr.drawImage(img, 0, 0, W, H);
    var revC = document.createElement('canvas');
    revC.width = W; revC.height = H;
    revC.getContext('2d').putImageData(revImg, 0, 0);
    xr.globalCompositeOperation = 'hard-light';
    xr.drawImage(revC, 0, 0);
    xr.globalCompositeOperation = 'source-over';

    // How much of the output is driven by blood vs by plain darkness?
    // For every strongly-amplified pixel, compare its hemoglobin lift
    // against its neutral (shading) lift. >1 means blood is driving it.
    var lumA = new Float32Array(W * H);
    for (k = 0; k < W * H; k++) {
      var kj2 = k * 4;
      lumA[k] = 0.299 * data.data[kj2] + 0.587 * data.data[kj2 + 1] + 0.114 * data.data[kj2 + 2];
    }
    function blur(src) {
      var o = new Float32Array(W * H), rad = 8;
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          var acc = 0, c2 = 0;
          for (var yy = Math.max(0, y - rad); yy <= Math.min(H - 1, y + rad); yy += 3) {
            for (var xx = Math.max(0, x - rad); xx <= Math.min(W - 1, x + rad); xx += 3) {
              acc += src[yy * W + xx]; c2++;
            }
          }
          o[y * W + x] = acc / c2;
        }
      }
      return o;
    }
    var hemoM = blur(hemo), shadeM = blur(shade);
    var lit = 0, litN = 0, hemoEv = 0, shadeEv = 0, maskN = 0;
    for (k = 0; k < W * H; k++) {
      if (bufs.mask[k] > 0.5) maskN++;
      var amp = Math.abs(revImg.data[k * 4] - 128);
      if (amp > 18) {
        litN++;
        hemoEv += Math.max(0, hemo[k] - hemoM[k]);
        shadeEv += Math.abs(shade[k] - shadeM[k]);
      }
      lit += amp;
    }
    report[f] = {
      maskSource: cat ? 'neural' : 'color',
      skin: +(res.skinFrac).toFixed(3),
      amplifiedFracOfSkin: maskN ? +(litN / maskN).toFixed(4) : 0,
      // >1 means the amplified pixels are driven by BLOOD, not by neutral
      // darkness (hair, shadow, crease)
      bloodVsNeutralEvidence: litN ? +((hemoEv / litN) / Math.max(shadeEv / litN, 1e-9)).toFixed(2) : 0
    };
  }

  document.getElementById('report').textContent = JSON.stringify(report, null, 1);
  window.__real = report;
})();
</script>
</body>
</html>
